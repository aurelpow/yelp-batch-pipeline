# app.local.conf
# Local development configuration for Yelp DE pipeline
# Overrides can be applied via --conf app.key=value on spark-submit

paths {
  src       = "C:/Users/aureb/Documents/yelp-batch-project/data/raw"       # raw Kaggle JSONs
  bronzeDir = "C:/Users/aureb/Documents/yelp-batch-project/data/bronze"    # Delta Bronze
  silverDir = "C:/Users/aureb/Documents/yelp-batch-project/data/silver"    # Delta Silver
  goldDir   = "C:/Users/aureb/Documents/yelp-batch-project/data/gold"      # Delta Gold
}

app {
  tables = "business,review,user,checkin,tip"      # default tables to process
  writeMode = "append"                       # dev runs -> append; CI can override to overwrite
}

# Runtime tuning (read by the app and set on spark.conf)
tuning {
  shufflePartitions = 64
  maxPartitionBytes = "32m"                  # spark.sql.files.maxPartitionBytes
}

delta.stats {
  numIndexedCols = 8                         # avoid indexing huge text cols by default
}

user {
  slim = true                                # drop heavy 'friends'/'elite' and write counts instead
}

writer {
  maxRecordsPerFile = 200000                  # keeps writer buffers small
}

mongo {
  uri = "mongodb+srv://user:pass@cluster.mongodb.net"
  database = "yelpde"
  collection = "business"
}