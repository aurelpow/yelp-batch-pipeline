// local.conf - Local Windows development environment
include "application.conf"

paths {
  rootDir = "C:/Users/aureb/Documents/yelp-batch-project"
  rawDir = ${paths.rootDir}"/data/raw"

  bronze {
    review   = ${paths.rootDir}"/data/bronze/review"
    tip      = ${paths.rootDir}"/data/bronze/tip"
    business = ${paths.rootDir}"/data/bronze/business"
    checkin  = ${paths.rootDir}"/data/bronze/checkin"
    user     = ${paths.rootDir}"/data/bronze/user"
  }
  silver {
    review   = ${paths.rootDir}"/data/silver/review_snapshot"
    tip      = ${paths.rootDir}"/data/silver/tip_snapshot"
    business = ${paths.rootDir}"/data/silver/business_snapshot"
    checkin  = ${paths.rootDir}"/data/silver/checkin_snapshot"
    user     = ${paths.rootDir}"/data/silver/user_snapshot"
  }
  gold {
    factReviewTipMetrics = ${paths.rootDir}"/data/gold/fact_review_tip_metrics"
    businessPopularity = ${paths.rootDir}"/data/gold/business_popularity"
  }
}

# MongoDB configuration
mongodb{
  uri = "mongodb://localhost:27017"
  database = "yelpAcademicDatasets"
}
# PostgreSQL configuration
postgresql{
  host = "localhost"
  port = 5432
  database = "yelp_analytics"
}

# Spark Deploy Mode (local development runs in client mode)
spark {
  deployMode = "client"
}